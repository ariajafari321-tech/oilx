# Daily refresh of the public data the five signals read (EIA, CFTC, futures closes).
# Without this the signals quietly go stale - the dashboard's "Signal inputs" check
# exists because that is exactly what happened on the laptop.
name: oilx refresh data
on:
  schedule:
    - cron: "40 22 * * 1-5"      # after the New York close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oilx-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -q -r requirements-bot.txt
      - run: python -m oilx fetch
      - name: Commit refreshed data
        run: |
          git config user.name "oilx-bot"
          git config user.email "oilx-bot@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -qm "data: refresh $(date -u +%F)"
          git push
